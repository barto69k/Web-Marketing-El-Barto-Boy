<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Campus · Grado en Marketing VIU</title>
  <style>
/* ===== Campus VIU · estilos (estética de la web original: grafito + rojo) ===== */
:root {
  --bg: #f1f1ef; --surface: #ffffff; --surface-2: #eceae6; --border: #e1e1dd;
  --text: #23262b; --muted: #6b7078; --accent: #c0262d; --accent-soft: #f8e4e5; --accent-text: #ffffff;
  --ok: #2f7d4f; --ok-soft: #e8f4ec; --warn: #a65b00; --warn-soft: #fdf0dc; --bad: #b42318; --bad-soft: #fde7e4;
  --nav: #2a2d32; --nav-text: #c4c7cc;
  --shadow: 0 1px 2px rgba(20,22,26,.06), 0 8px 22px rgba(20,22,26,.06);
  --radius: 14px; --sidebar: 248px;
  --font: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --surface: #222428; --surface-2: #2b2e33; --border: #33363b;
    --text: #ececec; --muted: #a0a4ab; --accent: #e0454b; --accent-soft: #3a2224; --accent-text: #ffffff;
    --ok: #6fcf97; --ok-soft: #1b3326; --warn: #f2b24c; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d;
    --nav: #101113; --shadow: 0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --surface: #222428; --surface-2: #2b2e33; --border: #33363b;
  --text: #ececec; --muted: #a0a4ab; --accent: #e0454b; --accent-soft: #3a2224; --accent-text: #ffffff;
  --ok: #6fcf97; --ok-soft: #1b3326; --warn: #f2b24c; --warn-soft: #3a2e17; --bad: #ff8a80; --bad-soft: #3d1f1d;
  --nav: #101113; --shadow: 0 1px 2px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15.5px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { line-height: 1.25; margin: 0; letter-spacing: -.02em; font-weight: 700; }
h1 { font-size: 2rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ----- layout ----- */
.app { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px; }
.brand-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 800; }
.brand b { display: block; font-size: .98rem; } .brand span { font-size: .78rem; color: var(--muted); }
.course-select label { font-size: .75rem; color: var(--muted); display: block; margin: 0 4px 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav .ico { width: 20px; text-align: center; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: .85rem; }
.side-foot .hint { color: var(--muted); font-size: .75rem; }
.topbar { display: none; }
main { padding: 26px clamp(16px, 3vw, 40px) 60px; max-width: 1240px; width: 100%; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
.page-head p { margin: 4px 0 0; color: var(--muted); }

/* ----- piezas ----- */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h2, .card > .card-title { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat b { font-size: 1.8rem; display: block; line-height: 1.1; }
.stat span { color: var(--muted); font-size: .85rem; }
.muted { color: var(--muted); } .small { font-size: .82rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.empty { color: var(--muted); padding: 12px 0; font-style: italic; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 7px 13px; border-radius: 10px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.btn.danger { color: var(--bad); }
input[type=text], input[type=date], input[type=url], select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; max-width: 100%; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; padding: 14px 16px; margin-bottom: 16px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--accent)); flex: none; display: inline-block; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 7px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
.b-oficial { background: var(--ok-soft); color: var(--ok); }
.b-recomendada { background: var(--warn-soft); color: var(--warn); }
.b-pendiente { background: var(--bad-soft); color: var(--bad); }
.b-ia { background: var(--bad-soft); color: var(--bad); }
.b-elaborado { background: var(--surface-2); color: var(--muted); }
.b-aviso { background: var(--warn-soft); color: var(--warn); }
.b-tipo { background: var(--surface-2); color: var(--muted); }

.bar { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 99px; transition: width .25s; }

.list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.list > li { padding: 10px 0; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.list > li:first-child { border-top: 0; padding-top: 0; }
.li-main { min-width: 0; flex: 1; }
.li-main b { display: block; overflow-wrap: anywhere; }
.li-date { text-align: right; font-size: .85rem; white-space: nowrap; }
.when-soon { color: var(--warn); font-weight: 700; } .when-late { color: var(--bad); font-weight: 700; }
.done { text-decoration: line-through; opacity: .6; }
.past { opacity: .55; }

.subject-card { border-top: 5px solid var(--c); display: flex; flex-direction: column; gap: 10px; }
.subject-card h3 { font-size: 1.05rem; }
.notice { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 8px; }
.notice.alto { border-color: var(--bad); background: var(--bad-soft); }
.notice.bajo { border-color: var(--border); background: var(--surface-2); }
.notice b { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .82rem; color: var(--muted); align-items: center; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: middle; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-top: 0; }
td.c, th.c { text-align: center; }
.table-wrap { overflow-x: auto; }

/* ----- calendario ----- */
.cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-head h2 { min-width: 170px; }
.cal-head h2::first-letter { text-transform: uppercase; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); padding: 4px 0; text-transform: uppercase; }
.day { min-height: 98px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 4px; display: flex; flex-direction: column; gap: 2px; text-align: left; overflow: hidden; }
.day.out { opacity: .4; }
.day.today { border: 2px solid var(--accent); }
.day.sel { background: var(--accent-soft); }
.day .n { font-size: .78rem; font-weight: 700; color: var(--muted); }
.ev { display: flex; gap: 4px; align-items: center; font-size: .68rem; line-height: 1.2; padding: 1px 4px; border-radius: 5px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-left: 3px solid var(--c); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ev.t-portafolio, .ev.t-examen { font-weight: 800; background: color-mix(in srgb, var(--c) 34%, var(--surface)); }
.ev.t-recomendada { border-left-style: dashed; }
.more { font-size: .68rem; color: var(--muted); }
.day-panel { margin-top: 14px; }

/* ----- móvil ----- */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(290px, 86vw); transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  body.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; }
  .topbar b { font-size: 1rem; }
  main { padding: 18px 16px 50px; }
  .day { min-height: 56px; padding: 3px; }
  .ev { font-size: 0; padding: 0; height: 6px; border-radius: 3px; border-left-width: 0; background: var(--c); }
  .day .n { font-size: .74rem; }
  .list > li { flex-direction: column; gap: 6px; }
  .li-date { text-align: left; }
}
@media print { .sidebar, .topbar, .filters { display: none; } .app { display: block; } }

/* ----- añadidos v1 ----- */
button.day { font: inherit; color: inherit; cursor: pointer; width: 100%; }
button.day:hover { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
.chip[aria-pressed="false"] { opacity: .45; background: var(--surface); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--surface)); border-color: var(--c, var(--accent)); }
.li-ctrl { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.li-ctrl select { font-size: .82rem; padding: 4px 8px; }
.list > li > input[type=checkbox] { margin-top: 3px; }
a.card:hover { border-color: var(--c, var(--accent)); }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: .85em; overflow-wrap: anywhere; }
summary { cursor: pointer; }
.page-head p a { text-decoration: none; font-weight: 600; }
.card > h2 a.small { font-weight: 500; }
@media (max-width: 860px) { .li-ctrl { align-items: flex-start; width: 100%; } }

/* ----- tema original: barra lateral grafito, portadas y banner ----- */
.sidebar { background: var(--nav); border-right: 0; color: #e8e9eb; }
.brand b { color: #fff; font-size: 1.1rem; } .brand span { color: #9ea2a9; }
.brand-logo { border-radius: 10px; }
.course-select label { color: #9ea2a9; }
.course-select select { width: 100%; background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.22); }
option { color: #23262b; background: #fff; }
.nav a { color: var(--nav-text); gap: 11px; padding: 10px 12px; transition: background .18s, color .18s; }
.nav a svg { flex: none; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a[aria-current="page"] { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(192,38,45,.35); }
.side-foot .btn { background: transparent; color: #e8e9eb; border-color: rgba(255,255,255,.3); }
.side-foot .btn:hover { background: rgba(255,255,255,.08); }
.side-foot .hint { color: #9ea2a9; }
.btn { border-radius: 10px; font-weight: 500; transition: .15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--surface); }
.side-foot .btn:hover { color: #fff; background: rgba(255,255,255,.08); }
.btn.primary, .btn.primary:hover { color: #fff; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.nav :focus-visible, .bottombar :focus-visible { outline-color: #fff; }
a.card.subject-card:hover, .subject-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(20,22,26,.14); }
.card { transition: transform .2s, box-shadow .2s; }
main { animation: fi .35s ease both; }
@keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bar { height: 9px; }

.cov { position: relative; height: 110px; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #25282c, #464a52); }
.cov.big { height: 180px; }
.cov svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cov:after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.5), transparent 65%); }
.cov span { position: absolute; z-index: 1; left: 14px; bottom: 10px; color: #fff; font-weight: 700; letter-spacing: .1em; font-size: .8rem; }
.subject-card.has-cover { border-top: 0; padding: 12px 12px 16px; }
.subject-card.has-cover > :not(.cov) { margin-left: 4px; margin-right: 4px; }

.banner { position: relative; min-height: clamp(190px, 28vw, 300px); border-radius: 18px; overflow: hidden; background: #25282c; box-shadow: var(--shadow); display: flex; align-items: flex-end; margin-bottom: 18px; }
.banner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner:after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgba(16,17,19,.78), rgba(16,17,19,.15) 70%); }
.banner .bt { position: relative; z-index: 1; padding: clamp(18px, 3vw, 36px); color: #fff; }
.banner .bt small { display: block; color: #d9dbe0; letter-spacing: .12em; text-transform: uppercase; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.banner h1 { color: #fff; margin: 0; font-size: clamp(1.7rem, 4.5vw, 2.8rem); max-width: 16ch; line-height: 1.1; }
.banner i { display: block; width: 56px; height: 4px; background: var(--accent); border-radius: 2px; margin-top: 14px; }
.hero { background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--c, var(--accent)); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin: 0 0 16px; }
.hero .big { font-size: clamp(1.5rem, 3.5vw, 2rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0; }

.bottombar { display: none; }
.topbar { background: var(--nav); color: #fff; border-bottom: 0; }
.topbar small { color: #9ea2a9; }
.topbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.3); }
@media (max-width: 860px) {
  body { padding-bottom: 84px; }
  .sidebar .nav { display: none; }
  .bottombar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--nav); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); gap: 0; overflow-x: auto; }
  .bottombar a { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; padding: 6px 8px; min-width: 60px; text-align: center; color: var(--nav-text); text-decoration: none; border-radius: 10px; }
  .bottombar a[aria-current="page"] { background: var(--accent); color: #fff; }
  .topbar small { display: inline; }
  .cov.big { height: 130px; }
}

/* ----- sesiones ----- */
textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); resize: vertical; }
#toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #23262b; color: #fff; padding: 10px 18px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; box-shadow: var(--shadow); font-size: .9rem; }
#toast.show { opacity: 1; }
label.check.card { box-shadow: none; }
@media (max-width: 860px) { #toast { bottom: 96px; } }

a.btn { text-decoration: none; display: inline-block; }


/* ===== v1.1: buscador, actividades, exámenes, biblioteca con adjuntos ===== */
[hidden] { display: none !important; }
input[type=search], input[type=number] { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; max-width: 100%; }
mark { background: color-mix(in srgb, var(--accent) 24%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.searchbox { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.searchbox > label.field { font-size: .85rem; font-weight: 600; color: var(--text); }
.searchbox input[type=search] { width: 100%; font-size: 1.02rem; padding: 11px 14px; border-radius: 12px; }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchips .btn { border-radius: 99px; padding: 4px 12px; }
#calRes { margin-bottom: 14px; }
.list > li.past { opacity: .62; }

.act { display: block; }
.stepper { list-style: none; display: flex; padding: 0; margin: 14px 0 12px; }
.stepper li { flex: 1; min-width: 0; position: relative; }
.stepper li + li::before { content: ""; position: absolute; top: 19px; left: -50%; width: 100%; height: 3px; background: var(--border); z-index: 0; }
.stepper li.on + li::before { background: var(--c, var(--accent)); }
.step { position: relative; z-index: 1; width: 100%; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 1px; color: var(--muted); font-size: .72rem; line-height: 1.2; text-align: center; }
.step .sn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border); background: var(--surface); font-weight: 700; font-size: .82rem; transition: .15s; }
.step:hover .sn { border-color: var(--c, var(--accent)); }
.step.on { color: var(--text); }
.step.on .sn { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
.checks { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; }
.check { display: inline-flex; gap: 8px; align-items: flex-start; }
.exam .list > li { border-top: 1px solid var(--border); }
tr.past { opacity: .55; }
.drop { display: block; border: 2px dashed var(--border); border-radius: 12px; padding: 22px 14px; text-align: center; cursor: pointer; transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }

.bottombar button { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; padding: 6px 8px; min-width: 60px; background: none; border: 0; color: var(--nav-text); border-radius: 10px; }
.bottombar button[aria-expanded="true"] { background: var(--accent); color: #fff; }
@media (max-width: 860px) {
  .sidebar .nav { display: flex; }
  .bottombar a, .bottombar button { flex: 1 1 0; min-width: 0; }
  .step { font-size: .62rem; }
  .step .sn { width: 26px; height: 26px; }
  .stepper li + li::before { top: 17px; }
  .act-info { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .grid.g4:has(> .stat) { grid-template-columns: 1fr 1fr; gap: 10px; }
  .card.stat { padding: 12px; } .card.stat b { font-size: 1.5rem; }
}

</style>
</head>
<body>
  <div class="topbar">
    <button class="btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">☰</button>
    <b>Mi Campus</b><small>Grado en Marketing · VIU</small>
  </div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">M</div>
        <div><b>Mi Campus</b><span>Grado en Marketing · VIU</span></div>
      </div>
      <div class="course-select">
        <label for="cursoSel">Curso</label>
        <select id="cursoSel" style="width:100%"></select>
      </div>
      <nav class="nav" id="nav" aria-label="Secciones">
      </nav>
      <div class="side-foot">

    prefs: { tema: 'auto', curso: CURSOS[0].id, ultimaCopia: null,

  /* ----- CALENDARIO ----- */
  const fechasEv = () => curso().eventos.map((e) => e.fecha).sort();
  let cal = null, selDay = null;
  function initCal() {
    const f = fechasEv();
    const min = parse(f[0]), max = parse(f[f.length - 1]);
    cal = { minY: min.getFullYear(), minM: min.getMonth(), maxY: max.getFullYear(), maxM: max.getMonth() };
    let t = new Date();
    let idx = t.getFullYear() * 12 + t.getMonth();
    idx = Math.max(cal.minY * 12 + cal.minM, Math.min(cal.maxY * 12 + cal.maxM, idx));

  function dayPanel() {

      g += `<button type="button" class="day${f === h ? ' today' : ''}${f === selDay ? ' sel' : ''}" data-act="dia" data-fecha="${f}" aria-label="${d} de ${esc(nombreMes)}: ${L.length} eventos"><span class="n">${d}</span>${pills}${L.length > 3 ? `<span class="more">+${L.length - 3} más</span>` : ''}</button>`;
    }
    return `<div class="cal-head"><button class="btn small" data-act="mes" data-d="-1" ${idx <= cal.minY * 12 + cal.minM ? 'disabled' : ''} aria-label="Mes anterior">◀</button>

      <button class="btn small" data-act="mes" data-d="1" ${idx >= cal.maxY * 12 + cal.maxM ? 'disabled' : ''} aria-label="Mes siguiente">▶</button>
      <button class="btn small" data-act="mes" data-d="hoy">Hoy</button></div>
      <div class="cal">${g}</div>
      <div class="card day-panel" id="dayPanel">${dayPanel()}</div>`;
  }
  function calAgenda() {
    const h = hoy();

    return Object.keys(g).sort().map((f) => `<section class="card" style="margin-bottom:12px"><h2>${esc(fmtLargo(f))} <span class="small ${cuando(f).cls}">${esc(cuando(f).txt)}</span></h2><ul class="list">${g[f].map((e) => eventoItem(e, false)).join('')}</ul></section>`).join('');
  }
  const calBody = () => (S.prefs.cal.vista === 'agenda' ? calAgenda() : calMes());

  V.calendario = function () {
    if (!cal) initCal();

  /* ----- BUSCADOR INTELIGENTE DEL CALENDARIO ----- */
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
  const STOP = new Set(['de', 'del', 'la', 'el', 'los', 'las', 'en', 'a', 'al', 'y', 'e', 'o', 'un', 'una', 'mi', 'mis', 'para', 'con', 'por', 'que', 'cuando', 'cual', 'hay', 'tengo', 'es', 'son', 'dia', 'dias', 'me', 'toca']);
  const SYN = {
    clase: ['sesion'], clases: ['sesion'], sesiones: ['sesion'], teoria: ['teorica'], practica: ['practico'], practicas: ['practica'],
    tutorias: ['tutoria'], entregas: ['entrega'], entrega: ['recomendada', 'portafolio'], evidencia: ['entrega'], evidencias: ['evidencia'],
    actividad: ['entrega'], actividades: ['actividad'], informe: ['evidencia'], informes: ['informe'], tarea: ['entrega'], tareas: ['entrega'],
    plazo: ['portafolio'], limite: ['portafolio'], deadline: ['portafolio'], portafolios: ['portafolio'], foro: ['portafolio'],
    examenes: ['examen'], prueba: ['examen'], pruebas: ['examen'], final: ['examen'], test: ['examen'], parcial: ['examen'],
    eco: ['economia'], conta: ['contabilidad'], stats: ['estadistica'], estadistica: ['estadistica'], comu: ['comunicacion'], costes: ['contabilidad'],
    recomendadas: ['recomendada'], oficiales: ['oficial']
  };
  const lev = (a, b) => {
    const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  };
  const hayCache = new Map();
  function hayDe(e) {
    const k = curso().id + '|' + e.id;
    if (hayCache.has(k)) return hayCache.get(k);
    const a = asigDe(e.asig) || {};
    const d = parse(e.fecha);
    const dd = pad(d.getDate()), mm = pad(d.getMonth() + 1), yy = d.getFullYear();
    const conv = (/(\d)\.ª/.exec(e.titulo) || [])[1];
    const txt = [e.titulo, e.detalle, tipoLabel(e.tipo), a.nombre, a.corto, e.asig, hora(e), e.ini, e.fin || '',
      e.fiabilidad === 'recomendada' ? 'recomendada sugerida' : 'oficial', MESES[d.getMonth()], DIAS[d.getDay()],
      `${dd}/${mm}/${yy}`, `${dd}/${mm}`, `${+dd}/${+mm}`, `${+dd}/${+mm}/${yy}`, String(+dd), String(yy), `${MESES[d.getMonth()]} ${yy}`,
      conv ? `conv${conv}` : '', e.tipo === 'sesion' ? 'clase' : '', e.tipo === 'examen' ? 'prueba final' : '',
      e.tipo === 'portafolio' ? 'plazo limite entrega' : '', e.tipo === 'recomendada' ? 'entrega' : ''].join(' ');
    const hay = norm(txt);
    const out = { hay, words: hay.split(/[^a-z0-9:\/]+/).filter(Boolean) };
    hayCache.set(k, out);
    return out;
  }
  function qParse(raw) {
    let q = ' ' + norm(raw).replace(/\s+/g, ' ') + ' ';
    const h = hoy();
    const pr = [];
    const lunes = (f) => { const d = parse(f); const dow = (d.getDay() + 6) % 7; return ymd(new Date(d.getFullYear(), d.getMonth(), d.getDate() - dow)); };
    const take = (re, fn) => { if (re.test(q)) { q = q.replace(new RegExp(re.source, 'g'), ' '); pr.push(fn); } };
    const mas7 = ymd(new Date(parse(h).getTime() + 7 * 864e5));
    take(/ (semana que viene|proxima semana|siguiente semana) /, (e) => lunes(e.fecha) === lunes(mas7));
    take(/ esta semana /, (e) => lunes(e.fecha) === lunes(h));
    take(/ este mes /, (e) => e.fecha.slice(0, 7) === h.slice(0, 7));
    take(/ hoy /, (e) => e.fecha === h);
    take(/ manana /, (e) => e.fecha === ymd(new Date(parse(h).getTime() + 864e5)));
    take(/ (proximos|proximas|proximo|proxima|siguientes|futuros|futuras|pendientes) /, (e) => e.fecha >= h);
    take(/ (pasados|pasadas|pasado|anteriores) /, (e) => e.fecha < h);
    q = q.replace(/ (?:primera|1\.?ª?|1a) (?:convocatoria|convoc\.?|conv\.?) /g, ' conv1 ').replace(/ (?:segunda|2\.?ª?|2a) (?:convocatoria|convoc\.?|conv\.?) /g, ' conv2 ')
      .replace(/ ordinaria /g, ' conv1 ').replace(/ (extraordinaria|recuperacion) /g, ' conv2 ');
    q = q.replace(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g, (m, y, mo, d) => `${pad(+d)}/${pad(+mo)}/${y}`)
      .replace(/\b(\d{1,2})-(\d{1,2})(?:-(\d{4}))?\b/g, (m, d, mo, y) => `${pad(+d)}/${pad(+mo)}${y ? '/' + y : ''}`);
    const toks = uniq(q.split(/[^a-z0-9:\/]+/).filter((t) => t && !STOP.has(t)));
    return { pr, toks };
  }
  function scoreTok(tok, words, hay) {
    const alts = [tok].concat(SYN[tok] || []);
    let best = 0;
    alts.forEach((t, idx) => {
      let s = 0;
      if (/^\d+$/.test(t)) s = words.includes(t) ? 3 : (words.some((w) => w.startsWith(t + ':')) ? 2 : 0);
      else if (words.includes(t)) s = 3;
      else if (t.length >= 2 && words.some((w) => w.startsWith(t))) s = 2;
      else if (t.length >= 4 && hay.includes(t)) s = 1.5;
      else if (t.length >= 5 && !/\d/.test(t)) { const mx = t.length >= 8 ? 2 : 1; if (words.some((w) => Math.abs(w.length - t.length) <= mx && lev(w, t) <= mx)) s = 1; }
      if (idx > 0) s *= 0.9;
      if (s > best) best = s;
    });
    return best;
  }
  const cmpEv = (a, b) => (a.fecha + a.ini).localeCompare(b.fecha + b.ini);
  function buscarEventos(raw) {
    const { pr, toks } = qParse(raw);
    const base = calFiltrados().filter((e) => pr.every((p) => p(e)));
    if (!toks.length) return { L: pr.length ? base.sort(cmpEv) : [], toks, parcial: false };
    const sc = base.map((e) => { const { hay, words } = hayDe(e); return { e, parts: toks.map((t) => scoreTok(t, words, hay)) }; });
    let L = sc.filter((x) => x.parts.every((p) => p > 0));
    let parcial = false;
    if (!L.length && toks.length > 1) {
      L = sc.filter((x) => x.parts.some((p) => p > 0)).sort((a, b) => b.parts.filter(Boolean).length - a.parts.filter(Boolean).length || cmpEv(a.e, b.e));
      parcial = true;
    } else L.sort((a, b) => cmpEv(a.e, b.e));

  }

    if (FS.db) return Promise.resolve(FS.db);

  const fsWrite = (fn) => fsOpen().then((db) => new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); fn(tx.objectStore('files')); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }));

      case 'cal-clear': calQ = ''; { const i = $('#calQ'); if (i) { i.value = ''; i.focus(); } } refCal(); return true;

      }

      case 'ses-quitar':
        if (confirm('¿Quitar esta sesión de la lista? (Los enlaces y notas que hayas guardado se conservan.)')) { S.sesExp[el.dataset.id] = 'no'; save(); keepRender(); }
        return true;
      case 'bib-open': {
        const r = FS.cache.find((x) => x.id === el.dataset.id); if (!r) return true;
        const u = URL.createObjectURL(r.blob); const w = window.open(u, '_blank');
        if (!w) descargarBlob(r);
        setTimeout(() => URL.revokeObjectURL(u), 120000); return true;
      }
      case 'bib-dl': { const r = FS.cache.find((x) => x.id === el.dataset.id); if (r) descargarBlob(r); return true; }
      case 'bib-del': {

    }

  /* ---------- menú lateral: todas las secciones ---------- */
  const IC = {
    inicio: 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
    asignaturas: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5',
    sesiones: 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM10 9l5 3-5 3z',
    calendario: 'M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18M8 3v4M16 3v4',
    tareas: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h15',
    actividades: 'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 5h6M9 14l2 2 4-4',
    examenes: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4',
    biblioteca: 'M4 4h4v16H4zM10 4h4v16h-4zM16 6l4 1-3 13-4-1z',
    progreso: 'M4 20V10M10 20V4M16 20v-8M22 20H2',
    menu: 'M4 7h16M4 12h16M4 17h16'
  };
  const NAV = [['inicio', 'Inicio'], ['asignaturas', 'Asignaturas'], ['sesiones', 'Sesiones'], ['calendario', 'Calendario'], ['tareas', 'Tareas'],
    ['actividades', 'Actividades'], ['examenes', 'Exámenes'], ['biblioteca', 'Biblioteca'], ['progreso', 'Progreso']];
  const NAV_MOVIL = ['inicio', 'calendario', 'actividades', 'examenes'];
  const icono = (k) => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[k]}"/></svg>`;
  function buildNav() {
    const n = $('#nav'); if (n) n.innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" data-r="${k}">${icono(k)}<span>${l}</span></a>`).join('');
    const b = $('#bottomNav');
    if (b) b.innerHTML = NAV.filter(([k]) => NAV_MOVIL.includes(k)).map(([k, l]) => `<a href="#/${k}" data-r="${k}">${icono(k)}<span>${l}</span></a>`).join('') +
      `<button type="button" id="bottomMenu" aria-label="Abrir menú con todas las secciones" aria-expanded="false">${icono('menu')}<span>Menú</span></button>`;
    const bm = $('#bottomMenu');
    if (bm) bm.addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); bm.setAttribute('aria-expanded', String(open)); });
  }


  /* =====================================================
     ENRUTADO
     ===================================================== */
  function render() {
    const h = location.hash.replace(/^#\/?/, '');
    const [sec, arg] = h.split('/');
    const vista = V[sec] ? sec : 'inicio';
    $$('[data-r]').forEach((a) => { if (a.dataset.r === vista) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    main.innerHTML = V[vista](arg ? decodeURIComponent(arg) : undefined);
    if (vista === 'biblioteca') cargarArchivos();
    const bm = $('#bottomMenu'); if (bm) bm.setAttribute('aria-expanded', 'false');
    document.title = `${vista.charAt(0).toUpperCase() + vista.slice(1)} · Mi Campus VIU`;
    window.scrollTo(0, 0);
    document.body.classList.remove('nav-open');
    $('#menuBtn') && $('#menuBtn').setAttribute('aria-expanded', 'false');
  }
  const currentView = () => (location.hash.replace(/^#\/?/, '').split('/')[0] || 'inicio');

  /* =====================================================
     EVENTOS
     ===================================================== */
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (clickExtra(el, act, ev)) return;
    if (act === 'dia') {
      selDay = el.dataset.fecha;
      $('#calBody').innerHTML = calBody();
      const p = $('#dayPanel'); if (p) p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else if (act === 'mes') {
      const d = el.dataset.d;
      let idx = cal.y * 12 + cal.m;
      if (d === 'hoy') { const t = new Date(); idx = t.getFullYear() * 12 + t.getMonth(); } else idx += Number(d);
      idx = Math.max(cal.minY * 12 + cal.minM, Math.min(cal.maxY * 12 + cal.maxM, idx));
      cal.y = Math.floor(idx / 12); cal.m = idx % 12; selDay = null;
      $('#calBody').innerHTML = calBody();
    } else if (act === 'vista') {
      S.prefs.cal.vista = el.dataset.v; save(); render();
    } else if (act === 'cal-asig') {
      const off = S.prefs.cal.asigsOff; const v = el.dataset.v;
      const visible = !off.includes(v);
      if (visible) off.push(v); else off.splice(off.indexOf(v), 1); // pulsar alterna visible/oculta
      el.setAttribute('aria-pressed', String(!visible)); save();
      refCal();
    } else if (act === 'tarea-borrar') {
      if (confirm('¿Borrar esta tarea personal?')) {
        S.personales = S.personales.filter((p) => p.id !== el.dataset.id); delete S.tareas[el.dataset.id]; save();
        $('#tarLista').innerHTML = tareasLista();
      }
    } else if (act === 'ses-share') {
      const s = sesDe(el.dataset.id); const l = (s.links || [])[Number(el.dataset.i)]; const u = l && urlOk(l.u);
      const e = sesionesCurso().find((x) => x.id === el.dataset.id);
      if (u && e) compartir(`${(asigDe(e.asig) || {}).corto || ''} · ${e.titulo}${l.t ? ' · ' + l.t : ''}`, u);
    } else if (act === 'ses-del') {
      const s = sesGet(el.dataset.id);
      if (confirm('¿Quitar este enlace de la sesión?')) { s.links.splice(Number(el.dataset.i), 1); save(); render(); }
    } else if (act === 'ses-export') { exportarEnlaces();
    } else if (act === 'ir-sesiones') { S.prefs.ses.asig = el.dataset.v; S.prefs.ses.estado = ''; S.prefs.ses.q = ''; save();
    } else if (act === 'rename-tema') {
      const c = curso(); let t = null;
      c.asignaturas.forEach((a) => a.temas.forEach((x) => { if (x.id === el.dataset.tema) t = x; }));
      if (!t) return;
      const nuevo = prompt(`Nombre para «${t.nombre}» (déjalo vacío para quitar el nombre personalizado):`, S.nombresTemas[t.id] || t.titulo || '');
      if (nuevo === null) return;
      if (nuevo.trim()) S.nombresTemas[t.id] = nuevo.trim().slice(0, 140); else delete S.nombresTemas[t.id];
      save(); render();
    }
  });

  document.addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (changeExtra(el, act)) return;
    if (act === 'cal-tipo') {
      // tiposOff contiene los tipos ocultos: casilla marcada = visible
      const off = S.prefs.cal.tiposOff; const i = off.indexOf(el.dataset.v);
      if (el.checked && i >= 0) off.splice(i, 1);
      if (!el.checked && i < 0) off.push(el.dataset.v);
      save(); refCal();
    } else if (act === 'cal-fiab') { S.prefs.cal.fiab = el.value; save(); refCal(); }
    else if (act === 'cal-pasados') { S.prefs.cal.pasados = el.checked; save(); refCal(); }
    else if (act === 'tarea-check') {
      const o = S.tareas[el.dataset.id] = S.tareas[el.dataset.id] || {};
      o.estado = el.checked ? 'hecha' : 'pendiente'; save(); $('#tarLista').innerHTML = tareasLista();
    } else if (act === 'tarea-estado') {
      const o = S.tareas[el.dataset.id] = S.tareas[el.dataset.id] || {};
      o.estado = el.value; save(); $('#tarLista').innerHTML = tareasLista();
    } else if (act === 'tarea-prio') {
      const o = S.tareas[el.dataset.id] = S.tareas[el.dataset.id] || {};
      o.prioridad = el.value; save(); $('#tarLista').innerHTML = tareasLista();
    } else if (act === 'tar-f') { S.prefs.tar[el.dataset.k] = el.value; save(); $('#tarLista').innerHTML = tareasLista(); }
    else if (act === 'tar-ocultar') { S.prefs.tar.ocultarHechas = el.checked; save(); $('#tarLista').innerHTML = tareasLista(); }
    else if (act === 'bib-f') { S.prefs.bib[el.dataset.k] = el.value; save(); refBib(); }
    else if (act === 'ses-f') { S.prefs.ses[el.dataset.k] = el.value; save(); $('#sesLista').innerHTML = sesLista(); }
    else if (act === 'ses-visto') { sesGet(el.dataset.id).visto = el.checked; save(); }
    else if (act === 'prog') {
      const p = S.progreso[el.dataset.tema] = S.progreso[el.dataset.tema] || {};
      p[el.dataset.k] = el.checked; save();
      const a = asigs().find((x) => x.temas.some((t) => t.id === el.dataset.tema));
      if (a) { const pr = progresoAsig(a); const sec = $('#prog-' + a.code); $('i', sec).style.width = pr.pct + '%'; $(`[data-pct="${a.code}"]`, sec).textContent = pr.pct + ' %'; }
    }
  });

  document.addEventListener('input', (ev) => {
    const ex = ev.target.closest('[data-act]'); if (ex && inputExtra(ex, ex.dataset.act)) return;
    const el = ev.target.closest('[data-act="bib-q"]');
    if (el) { S.prefs.bib.q = el.value; save(); refBib(); return; }
    const q = ev.target.closest('[data-act="ses-q"]');
    if (q) { S.prefs.ses.q = q.value; save(); $('#sesLista').innerHTML = sesLista(); return; }
    const n = ev.target.closest('[data-act="ses-nota"]');
    if (n) { sesGet(n.dataset.id).nota = n.value.slice(0, 2000); save(); }
  });

  document.addEventListener('submit', (ev) => {
    if (ev.target.id === 'formEnlace') {
      ev.preventDefault();
      const f = new FormData(ev.target); const u = urlOk(f.get('u'));
      if (!u) { alert('Ese enlace no es válido. Escribe una dirección completa, por ejemplo https://youtu.be/…'); return; }
      const s = sesGet(ev.target.dataset.id);
      if (s.links.some((l) => l.u === u)) { alert('Ese enlace ya está guardado en esta sesión.'); return; }
      s.links.push({ t: String(f.get('t') || '').trim().slice(0, 80), u }); save(); render(); toast('Enlace guardado');
      return;
    }
    if (ev.target.id !== 'formTarea') return;
    ev.preventDefault();
    const f = new FormData(ev.target);
    const titulo = String(f.get('titulo') || '').trim();
    if (!titulo) return;
    S.personales.push({ id: 'p-' + Date.now().toString(36), curso: curso().id, asig: String(f.get('asig')), titulo: titulo.slice(0, 120),
      fecha: f.get('fecha') || null, hora: null, prioridad: String(f.get('prioridad') || 'media'), detalle: 'Tarea personal' });
    save(); ev.target.reset(); $('#tarLista').innerHTML = tareasLista();
  });

  /* ---------- barra lateral: curso, tema, copias ---------- */
  const cursoSel = $('#cursoSel');
  if (cursoSel) {
    cursoSel.innerHTML = CURSOS.map((c) => `<option value="${esc(c.id)}">${esc(c.nombre)} · ${esc(c.cuatrimestre)}</option>`).join('');
    cursoSel.value = curso().id;
    cursoSel.addEventListener('change', () => { S.prefs.curso = cursoSel.value; save(); cal = null; render(); });
  }

  const TEMAS = ['auto', 'light', 'dark'];
  const TEMA_L = { auto: 'automático', light: 'claro', dark: 'oscuro' };
  function aplicaTema() {
    const t = S.prefs.tema || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    const b = $('#themeBtn'); if (b) b.textContent = 'Tema: ' + TEMA_L[t];
  }
  $('#themeBtn') && $('#themeBtn').addEventListener('click', () => {
    S.prefs.tema = TEMAS[(TEMAS.indexOf(S.prefs.tema) + 1) % TEMAS.length]; save(); aplicaTema();
  });
  $('#menuBtn') && $('#menuBtn').addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded', String(open));
  });

  // En móvil: tocar fuera del menú lateral lo cierra.
  document.addEventListener('click', (ev) => {
    if (!document.body.classList.contains('nav-open')) return;
    if (ev.target.closest('#sidebar') || ev.target.closest('#menuBtn') || ev.target.closest('#bottomMenu')) return;
    document.body.classList.remove('nav-open'); $('#menuBtn') && $('#menuBtn').setAttribute('aria-expanded', 'false');
  });

  $('#exportBtn') &&$('#exportBtn').addEventListener('click', () => {
    S.prefs.ultimaCopia = new Date().toISOString(); save();
    const data = { app: 'campus-viu', version: 1, exportado: S.prefs.ultimaCopia, datos: S };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `campus_viu_copia_${hoy()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    if (currentView() === 'inicio') render();
  });
  $('#importBtn') && $('#importBtn').addEventListener('click', () => $('#importFile').click());
  $('#importFile') && $('#importFile').addEventListener('change', (ev) => {
    const file = ev.target.files[0]; ev.target.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || o.app !== 'campus-viu' || !o.datos) throw new Error('formato');
        if (!confirm('Se reemplazarán las tareas, el progreso y las preferencias actuales por las de la copia. ¿Continuar?')) return;
        S = merge(defaults(), o.datos);
        if (!CURSOS.some((c) => c.id === S.prefs.curso)) S.prefs.curso = CURSOS[0].id;
        save(); cal = null; aplicaTema();
        if (cursoSel) cursoSel.value = curso().id;
        render(); alert('Copia importada correctamente.');
      } catch (e) { alert('Este archivo no es una copia válida del campus.'); }
    };
    r.readAsText(file);
  });

  window.addEventListener('hashchange', render);
  buildNav();
  aplicaTema();
  render();
})();

</script>
  <noscript>Esta web necesita JavaScript activado.</noscript>
</body>
</html>
